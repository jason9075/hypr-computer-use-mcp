[project]
name = "hypr-computer-use-mcp"
version = "0.1.0"
description = "MCP server exposing computer-use primitives for a Hyprland session"
requires-python = ">=3.10"
dependencies = ["mcp>=1.10", "pywayland>=0.4.17"]

[project.scripts]
hypr-computer-use-mcp = "hypr_computer_use.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypr_computer_use"]
# Generated at build time and git-ignored, which hatch would otherwise exclude.
artifacts = ["src/hypr_computer_use/protocols/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py310"
extend-exclude = ["src/hypr_computer_use/protocols"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
